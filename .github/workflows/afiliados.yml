name: Bot Afiliados ML

on:
  schedule:
    - cron: "0 11 * * *"   # 08h Brasília
    - cron: "0 15 * * *"   # 12h Brasília
    - cron: "0 19 * * *"   # 16h Brasília
    - cron: "0 22 * * *"   # 19h Brasília
    - cron: "0 00 * * *"   # 21h Brasília

  workflow_dispatch:

jobs:
  postar-ofertas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar Bot
        env:
          BOT_TOKEN:        ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:       ${{ secrets.CHANNEL_ID }}
          AFILIADO_ID:      ${{ secrets.AFILIADO_ID }}
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN:  ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python main.py

      - name: Salvar dados
        run: |
          git config user.name  "bot-afiliados"
          git config user.email "bot@users.noreply.github.com"
          git add historico.json estatisticas.json token_cache.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualiza dados [skip ci]"
            git push
          fi
