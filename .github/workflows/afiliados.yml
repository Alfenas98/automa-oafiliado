name: 🤖 Bot Afiliados ML

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      forcar_todas:
        description: "Rodar todas as categorias"
        required: false
        default: "true"

jobs:
  postar-ofertas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright e dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Rodar Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          AFILIADO_ID: ${{ secrets.AFILIADO_ID }}
        run: python main.py

      - name: Salvar dados
        run: |
          git config user.name "bot-afiliados"
          git config user.email "bot@users.noreply.github.com"
          git add historico.json estatisticas.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualiza dados [skip ci]"
            git push
          fi
