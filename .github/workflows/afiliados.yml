name: 🤖 Bot Afiliados ML — Inteligente

on:
  schedule:
    - cron: "0 11 * * *"    # 08h Brasília
    - cron: "0 15 * * *"    # 12h Brasília
    - cron: "0 19 * * *"    # 16h Brasília
    - cron: "0 22 * * *"    # 19h Brasília
    - cron: "0 00 * * *"    # 21h Brasília (resumo)

  workflow_dispatch:
    inputs:
      forcar_todas:
        description: "Rodar todas as categorias (ignora horário)"
        required: false
        default: "false"

jobs:
  postar-ofertas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 🚀 Rodar bot
        env:
          BOT_TOKEN:   ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:  ${{ secrets.CHANNEL_ID }}
          AFILIADO_ID: ${{ secrets.AFILIADO_ID }}
        run: python main.py

      - name: 💾 Salvar histórico e estatísticas
        run: |
          git config user.name "bot-afiliados[bot]"
          git config user.email "bot@users.noreply.github.com"
          
          git add historico.json estatisticas.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para commitar"
          else
            git commit -m "chore: atualiza dados [skip ci]"
            git push
          fi
